<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>My Dashboard</title>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --text: #fff; --accent: #0A84FF; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; }
        .ios-card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        h2 { font-size: 18px; margin-bottom: 10px; color: #8e8e93; }
        .post { border-bottom: 1px solid #333; padding: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="ios-card">
        <h2>آخر منشورات TechCSL</h2>
        <div id="feed">جاري التحميل...</div>
    </div>
</div>

<script>
    // رابط RSS لجلب منشورات القناة
    const rssUrl = "https://api.rss2json.com/v1/api.json?rss_url=https://rss.app/feeds/techcsl_feed.xml";

    fetch(rssUrl)
        .then(res => res.json())
        .then(data => {
            const feedDiv = document.getElementById('feed');
            feedDiv.innerHTML = data.items.slice(0, 3).map(item => `
                <div class="post">
                    <p style="font-weight:bold;">${item.title}</p>
                    <a href="${item.link}" style="color:var(--accent);">مشاهدة</a>
                </div>
            `).join('');
        });
</script>
</body>
</html>
