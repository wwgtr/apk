<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SAIF | System Forensic</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', Courier, monospace; padding: 20px; }
        .terminal { border: 1px solid #333; padding: 20px; border-radius: 10px; background: #000; width: 400px; }
        .line { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .val { color: #fff; }
    </style>
</head>
<body>

<div class="terminal">
    <div style="text-align:center; color:#fff; margin-bottom: 20px;">[ SYSTEM_DIAGNOSTIC ]</div>
    <div class="line">IP Address: <span id="ip" class="val">جاري الجلب...</span></div>
    <div class="line">المتصفح: <span id="browser" class="val"></span></div>
    <div class="line">النظام: <span id="os" class="val"></span></div>
    <div class="line">نسبة الشحن: <span id="battery" class="val"></span></div>
    <div class="line">المعمارية: <span id="arch" class="val"></span></div>
    <div class="line">الاتصال: <span id="network" class="val"></span></div>
</div>

<script>
    // 1. جلب الـ IP
    fetch('https://api.ipify.org?format=json')
        .then(r => r.json()).then(data => document.getElementById('ip').innerText = data.ip);

    // 2. معلومات النظام والشاشة
    document.getElementById('browser').innerText = navigator.appName;
    document.getElementById('os').innerText = navigator.platform;
    document.getElementById('arch').innerText = navigator.userAgent.includes('x86_64') ? 'x64' : 'ARM/32-bit';

    // 3. نسبة الشحن
    navigator.getBattery().then(battery => {
        document.getElementById('battery').innerText = Math.round(battery.level * 100) + "%";
    });

    // 4. حالة الشبكة
    if (navigator.connection) {
        document.getElementById('network').innerText = navigator.connection.effectiveType;
    } else {
        document.getElementById('network').innerText = "غير متاح";
    }
</script>
</body>
</html>
