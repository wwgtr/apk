<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SAIF | App Analyzer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-top: 0; }
        .info-row { display: flex; justify-content: space-between; margin: 15px 0; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        button { background: #38bdf8; border: none; padding: 12px 20px; border-radius: 10px; color: #000; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; }
    </style>
</head>
<body>

<div id="capture" class="card">
    <h2>معلومات التطبيق</h2>
    <div class="info-row"><span>اسم الملف:</span> <span id="fileName">-</span></div>
    <div class="info-row"><span>حجم التطبيق:</span> <span id="fileSize">-</span></div>
    <div class="info-row"><span>الحالة:</span> <span>جاهز للتحليل</span></div>
</div>

<input type="file" id="apkInput" style="margin-top: 20px;">
<button onclick="captureCard()">تحميل المعلومات كصورة</button>

<script>
    document.getElementById('apkInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            document.getElementById('fileName').innerText = file.name;
            document.getElementById('fileSize').innerText = (file.size / (1024 * 1024)).toFixed(2) + " MB";
        }
    });

    function captureCard() {
        html2canvas(document.querySelector("#capture")).then(canvas => {
            const link = document.createElement('a');
            link.download = 'app-info.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }
</script>
</body>
</html>
