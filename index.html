<div class="ios-card">
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <select id="formatSelect" style="flex: 1; padding: 10px; border-radius: 10px; background: #2c2c2e; color: white;">
            <option value="mp4_1080">فيديو (1080p)</option>
            <option value="mp4_720">فيديو (720p)</option>
            <option value="mp3">صوت (MP3)</option>
        </select>
        <button onclick="downloadVideo()" style="background: #34C759; margin-top: 0;">تحميل</button>
    </div>
</div>

<script>
    function downloadVideo() {
        const url = document.getElementById('urlInput').value;
        const format = document.getElementById('formatSelect').value;
        
        if (!url) {
            alert("يرجى لصق رابط الفيديو أولاً");
            return;
        }

        // هنا يتم توجيه الطلب إلى الخادم الخاص بك أو خدمة API
        // مثال: https://api.yoursite.com/download?url=...&format=...
        alert("جارٍ تجهيز ملف " + format + " للتحميل...");
    }
</script>
