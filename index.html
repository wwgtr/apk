<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة معلومات الشبكة</title>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --text: #fff; --accent: #0A84FF; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 450px; }
        .ios-card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #333; }
        h1 { font-size: 20px; margin-bottom: 20px; text-align: center; }
        .label { color: #8e8e93; }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة معلوماتك</h1>
    <div class="ios-card" id="info">
        <div class="row"><span class="label">IP الخاص بك:</span> <b id="ip">-</b></div>
        <div class="row"><span class="label">الدولة:</span> <b id="country">-</b></div>
        <div class="row"><span class="label">مزود الخدمة:</span> <b id="isp">-</b></div>
        <div class="row"><span class="label">المدينة:</span> <b id="city">-</b></div>
        <div class="row"><span class="label">نوع الاتصال:</span> <b id="type">جاري الفحص...</b></div>
    </div>
</div>

<script>
    fetch('https://ipapi.co/json/')
    .then(response => response.json())
    .then(data => {
        document.getElementById('ip').innerText = data.ip;
        document.getElementById('country').innerText = data.country_name;
        document.getElementById('isp').innerText = data.org;
        document.getElementById('city').innerText = data.city;
        // الفكرة الإضافية: تحديد نوع الشبكة
        document.getElementById('type').innerText = data.org.toLowerCase().includes('mobile') ? 'بيانات هاتف' : 'شبكة أرضية/واي فاي';
    });
</script>
</body>
</html>
