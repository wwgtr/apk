<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SAIF | Deep Forensic Analysis</title>
    <!-- مكتبة التحليل العميق -->
    <script src="https://cdn.jsdelivr.net/npm/apk-parser@0.1.0/dist/apk-parser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { background: #080808; color: #00ff41; font-family: 'JetBrains Mono', monospace; padding: 20px; }
        
        #deep-report {
            width: 500px; padding: 30px; border: 1px solid #00ff41;
            background: radial-gradient(circle at top right, #0a1a0a, #000);
            box-shadow: 0 0 40px rgba(0,255,65,0.1);
        }

        .section-title { color: #fff; border-bottom: 1px solid #00ff41; margin: 15px 0; padding-bottom: 5px; text-transform: uppercase; }
        .val { color: #fff; }
        .perm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 10px; }
        .tag { border: 1px solid #00ff41; padding: 2px 5px; border-radius: 3px; }
    </style>
</head>
<body>

<div id="deep-report">
    <div style="text-align:center; font-size: 20px; font-weight:bold;">DEEP_ANALYSIS_PROTOCOL</div>
    
    <div class="section-title">Identity</div>
    <p>NAME: <span id="app-name" class="val">-</span></p>
    <p>PACKAGE: <span id="pkg-name" class="val">-</span></p>
    
    <div class="section-title">Architecture</div>
    <p id="arch-list" class="val">-</p>

    <div class="section-title">Permissions (Security)</div>
    <div id="perm-list" class="perm-grid"></div>

    <div style="margin-top: 30px; text-align: center; font-size: 8px;">
        POWERED BY TECH_CSL | NEXAI_AR
    </div>
</div>

<input type="file" id="input">
<button onclick="capture()">EXPORT_CRITICAL_DATA</button>

<script>
    document.getElementById('input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        // استخدام محلل APK الحقيقي
        const parser = new ApkParser(file);
        const data = await parser.parse();
        
        // تعبئة البيانات العميقة
        document.getElementById('app-name').innerText = data.package.label;
        document.getElementById('pkg-name').innerText = data.package.name;
        document.getElementById('arch-list').innerText = data.package.nativeCode?.join(' | ') || "Pure Java/Kotlin";
        
        const perms = data.manifest.usesPermission;
        const pList = document.getElementById('perm-list');
        pList.innerHTML = perms.map(p => `<div class="tag">${p.split('.').pop()}</div>`).join('');
    });

    function capture() {
        html2canvas(document.querySelector("#deep-report"), {scale: 4, backgroundColor: "#080808"})
            .then(c => {
                const a = document.createElement('a');
                a.href = c.toDataURL();
                a.download = 'DEEP_REPORT.png';
                a.click();
            });
    }
</script>
</body>
</html>
