<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SAIF | GEOLOCATION FORENSICS</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { border: 1px solid #00ff41; padding: 20px; border-radius: 10px; background: #0a0a0a; }
        .val { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

<h1 style="text-align:center;">[ GEOGRAPHIC_RECON_UNIT ]</h1>

<div class="grid">
    <div class="panel">
        <h3>تحديد عبر الـ IP</h3>
        <div id="ip-data">جاري البحث...</div>
    </div>
    <div class="panel">
        <h3>تحديد عبر الـ GPS (دقيق)</h3>
        <div id="gps-data">يرجى السماح بالوصول للموقع...</div>
    </div>
</div>

<script>
    // 1. تحديد عبر IP
    fetch('https://ipapi.co/json/')
        .then(r => r.json())
        .then(data => {
            document.getElementById('ip-data').innerHTML = `
                <div>الـ IP: <span class="val">${data.ip}</span></div>
                <div>المدينة: <span class="val">${data.city}</span></div>
                <div>الدولة: <span class="val">${data.country_name}</span></div>
                <div>المزود: <span class="val">${data.org}</span></div>
            `;
        });

    // 2. تحديد عبر GPS
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            document.getElementById('gps-data').innerHTML = `
                <div>خط العرض: <span class="val">${pos.coords.latitude.toFixed(4)}</span></div>
                <div>خط الطول: <span class="val">${pos.coords.longitude.toFixed(4)}</span></div>
                <div>الدقة: <span class="val">${pos.coords.accuracy} متر</span></div>
            `;
        });
    } else {
        document.getElementById('gps-data').innerText = "غير مدعوم في هذا المتصفح";
    }
</script>
</body>
</html>
