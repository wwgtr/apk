<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SAIF | Advanced Analyzer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@200;400;700&display=swap');
        
        body { font-family: 'Cairo', sans-serif; background: #020617; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }

        /* البطاقة الاحترافية */
        #capture { 
            width: 400px; padding: 40px; border-radius: 30px;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative; overflow: hidden;
        }

        .header-glow { position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: #0ea5e9; filter: blur(80px); opacity: 0.3; }

        h2 { font-size: 24px; margin-bottom: 30px; text-align: center; letter-spacing: 2px; }
        .data-list { list-style: none; padding: 0; }
        .item { display: flex; justify-content: space-between; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .key { color: #94a3b8; font-size: 14px; }
        .value { font-weight: 700; color: #f8fafc; }

        .brand-footer { margin-top: 40px; display: flex; justify-content: space-between; align-items: center; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .brand-text { font-size: 12px; color: #38bdf8; font-weight: bold; }

        button { margin-top: 30px; padding: 15px 40px; background: linear-gradient(90deg, #0ea5e9, #6366f1); border: none; border-radius: 15px; color: white; font-weight: bold; cursor: pointer; transition: 0.4s; }
        button:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(14, 165, 233, 0.3); }
    </style>
</head>
<body>

<div id="capture">
    <div class="header-glow"></div>
    <h2>تـقـريـر الـتـطـبـيـق</h2>
    <div class="data-list">
        <div class="item"><span class="key">الاسم:</span> <span id="name" class="value">-</span></div>
        <div class="item"><span class="key">الحجم:</span> <span id="size" class="value">-</span></div>
        <div class="item"><span class="key">المعمارية:</span> <span id="arch" class="value">-</span></div>
        <div class="item"><span class="key">عدد الملفات:</span> <span id="filesCount" class="value">-</span></div>
    </div>
    <div class="brand-footer">
        <div class="brand-text">@TechCsl</div>
        <div class="brand-text">@NEXAI_AR</div>
    </div>
</div>

<input type="file" id="apkInput" style="margin-top: 20px;">
<button onclick="downloadReport()">تصدير التقرير الفائق الجودة</button>

<script>
    document.getElementById('apkInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        const zip = await JSZip.loadAsync(file);
        
        document.getElementById('name').innerText = file.name;
        document.getElementById('size').innerText = (file.size / (1024*1024)).toFixed(2) + " MB";
        document.getElementById('filesCount').innerText = Object.keys(zip.files).length;
        
        const archs = [];
        zip.folder("lib")?.forEach(p => { if(!archs.includes(p.split('/')[0])) archs.push(p.split('/')[0]) });
        document.getElementById('arch').innerText = archs.join(', ') || "Generic";
    });

    function downloadReport() {
        html2canvas(document.querySelector("#capture"), { scale: 5, backgroundColor: "#020617" }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'SAIF_REPORT.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }
</script>
</body>
</html>
