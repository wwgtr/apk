<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مصحف التلاوات - استخراج تلقائي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
    <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; }
        canvas { width: 100%; height: 100px; background: #0f172a; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-6">

    <div class="w-full max-w-2xl">
        <h1 class="text-2xl font-bold text-emerald-400 text-center mb-6">استخراج وتشغيل كامل سور القرآن</h1>
        <canvas id="visualizer"></canvas>
        <div id="aplayer"></div>
    </div>

    <script>
        // قائمة أسماء السور لربطها بالروابط
        const surahNames = ["الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس", "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه", "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم", "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر", "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق", "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة", "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج", "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس", "التكوير", "الإنفطار", "المطففين", "الإنشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد", "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات", "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر", "المسد", "الإخلاص", "الفلق", "الناس"];

        // توليد الروابط برمجياً
        const audioList = surahNames.map((name, index) => ({
            name: `سورة ${name}`,
            artist: 'القرآن الكريم',
            url: `https://hmomen.com/static/app-res/quran/addel/${(index + 1).toString().padStart(3, '0')}.mp3`
        }));

        const ap = new APlayer({
            container: document.getElementById('aplayer'),
            audio: audioList,
            theme: '#10B981',
            listMaxHeight: 400
        });

        // كود الترددات (Visualizer)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioCtx.createAnalyser();
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        ap.on('play', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const audio = ap.audio.querySelector('audio');
            if (!audio.dataset.connected) {
                const source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                audio.dataset.connected = "true";
            }
            draw();
        });

        function draw() {
            requestAnimationFrame(draw);
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let x = 0;
            for(let i = 0; i < bufferLength; i += 10) {
                const barHeight = dataArray[i] / 2;
                ctx.fillStyle = '#10B981';
                ctx.fillRect(x, canvas.height - barHeight, 5, barHeight);
                x += 8;
            }
        }
    </script>
</body>
</html>
