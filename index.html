<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تتبع الأي بي</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(28, 28, 30, 0.8);
            --text-color: #ffffff;
            --accent-color: #0A84FF; /* لون أزرق آيفون */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .ios-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #2c2c2e;
            color: white;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 style="font-size: 24px; margin-bottom: 20px;">معلومات الشبكة</h1>

    <!-- معلومات الأي بي الخاص بك -->
    <div class="ios-card">
        <h2 style="font-size: 16px; color: #8e8e93;">عنوانك الحالي</h2>
        <div class="info-row"><span>IP:</span> <strong>192.168.1.1</strong></div>
        <div class="info-row"><span>المزود:</span> <strong>Zain Iraq</strong></div>
    </div>

    <!-- خانة البحث -->
    <div class="ios-card">
        <h2 style="font-size: 16px; margin-bottom: 10px;">تتبع عنوان آخر</h2>
        <input type="text" placeholder="أدخل عنوان IP هنا...">
        <button>عرض على الخريطة</button>
    </div>
</div>

</body>
</html>
