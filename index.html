<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px; 
            border-radius: 30px; 
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        button { 
            background: linear-gradient(45deg, #ff0055, #007aff);
            border: none; padding: 15px 30px; color: white; border-radius: 50px; cursor: pointer; font-size: 18px;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.1); }
    </style>
</head>
<body>

<div class="card">
    <h1>صندوق المفاجآت</h1>
    <p id="display">اضغط الزر لتجربة شيء عشوائي...</p>
    <button onclick="randomAction()">اضغط للحظ</button>
</div>

<script>
    const actions = [
        "تغيير لون خلفية الموقع!",
        "عرض حقيقة علمية غريبة.",
        "توليد رقم حظ.",
        "فتح صفحة ويكيبيديا عشوائية.",
        "عرض صورة قطة لطيفة!"
    ];
    function randomAction() {
        const choice = actions[Math.floor(Math.random() * actions.length)];
        document.getElementById('display').innerText = "تم اختيار: " + choice;
    }
</script>

</body>
</html>
