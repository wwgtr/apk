<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SAIF | VUDU_INTEGRATION_CHECK</title>
    <style>
        body { background: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; }
        .panel { border: 1px solid #00ff41; padding: 20px; border-radius: 15px; background: #000; width: 450px; margin: auto; }
        .status-badge { padding: 5px 10px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="panel">
    <h2 style="text-align:center;">فاحص توافق VUDU</h2>
    <div id="check-results"></div>
    <button onclick="runVuduCheck()" style="width:100%; padding:10px; background:#00ff41; border:none; margin-top:20px; cursor:pointer;">ابدأ الفحص التقني</button>
</div>

<script>
    function runVuduCheck() {
        const results = document.getElementById('check-results');
        results.innerHTML = "جاري فحص بيئة العمل...";

        // محاكاة منطق constants.java
        const isAndroid = /Android/i.test(navigator.userAgent);
        
        // محاكاة منطق SharedPrefManager
        const hasVuduData = localStorage.getItem('playerInfo') !== null;

        setTimeout(() => {
            results.innerHTML = `
                <p>النظام: <span class="status-badge">${isAndroid ? '✅ أندرويد' : '❌ غير مدعوم'}</span></p>
                <p>حالة البيانات: <span class="status-badge">${hasVuduData ? '✅ وجدت ملفات إعدادات' : '⚠️ لم يتم العثور على بيانات'}</span></p>
                <p>BASE_URL: <span style="color:#fff">https://isp.vodu.me/api/</span></p>
                <hr>
                <p style="font-size:12px; color:#555;">التقرير التقني: ${hasVuduData ? 'المستخدم لديه تفضيلات مشغل سابقة' : 'المستخدم جديد'}</p>
            `;
        }, 1500);
    }
</script>
</body>
</html>
