<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مصحف التلاوات - مشغل احترافي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
    <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; }
        #visualizer { width: 100%; height: 120px; border-radius: 8px; margin-bottom: 20px; background: #0f172a; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-lg">
        <h1 class="text-2xl font-bold text-emerald-400 text-center mb-6">الاستماع للقرآن الكريم</h1>
        
        <canvas id="visualizer"></canvas>
        
        <div id="aplayer" class="shadow-2xl"></div>
    </div>

    <script>
        // الروابط المستخرجة من موقعك
        const audioList = [
            {
                name: 'تلاوة مختارة',
                artist: 'hmomen.com',
                url: 'https://hmomen.com/static/app-res/quran/addel/001.mp3', // مثال للرابط
                cover: 'https://images.unsplash.com/photo-1594928065431-2852236d80c3'
            }
        ];

        const ap = new APlayer({
            container: document.getElementById('aplayer'),
            audio: audioList,
            theme: '#10B981'
        });

        // تشغيل محلل الترددات
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioCtx.createAnalyser();
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        ap.on('play', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const audio = ap.audio.querySelector('audio');
            const source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            draw();
        });

        function draw() {
            requestAnimationFrame(draw);
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const barWidth = 3;
            let x = 0;
            for(let i = 0; i < dataArray.length; i += 5) {
                const barHeight = dataArray[i] / 2;
                ctx.fillStyle = '#10B981';
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 2;
            }
        }
    </script>
</body>
</html>
