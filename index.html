<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SAIF | Core Forensic Analyzer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@300;700&display=swap');
        
        body { background: #000; color: #00ff41; font-family: 'Cairo', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        
        /* تصميم البطاقة الاستثنائي */
        #core-report {
            width: 480px; padding: 40px; border-radius: 10px;
            background: linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 100%);
            border-left: 5px solid #00ff41;
            box-shadow: 0 0 30px rgba(0,255,65,0.2);
            position: relative;
        }

        .header-title { font-family: 'Orbitron', sans-serif; font-size: 28px; text-transform: uppercase; text-align: center; margin-bottom: 20px; color: #fff; }
        .data-line { display: flex; justify-content: space-between; border-bottom: 1px dashed #333; padding: 10px 0; }
        .key { color: #888; font-size: 14px; }
        .val { font-weight: bold; color: #00ff41; font-family: monospace; }
        
        .watermark { margin-top: 30px; display: flex; justify-content: center; gap: 20px; border-top: 1px solid #333; pt: 20px; }
        .brand { font-family: 'Orbitron', sans-serif; font-size: 14px; color: #555; }

        button { background: transparent; border: 1px solid #00ff41; color: #00ff41; padding: 15px 30px; margin-top: 30px; cursor: pointer; transition: 0.3s; font-family: 'Orbitron'; }
        button:hover { background: #00ff41; color: #000; }
    </style>
</head>
<body>

<div id="core-report">
    <div class="header-title">SYS_ANALYZER</div>
    <div class="data-line"><span class="key">APP_ID:</span> <span id="pkg" class="val">NULL</span></div>
    <div class="data-line"><span class="key">VERSION:</span> <span id="ver" class="val">NULL</span></div>
    <div class="data-line"><span class="key">SIZE:</span> <span id="size" class="val">NULL</span></div>
    <div class="data-line"><span class="key">ARCH_DEEP:</span> <span id="arch" class="val">NULL</span></div>
    
    <div class="watermark">
        <span class="brand">TECH_CSL</span>
        <span class="brand">NEXAI_AR</span>
    </div>
</div>

<input type="file" id="upload" style="display:none">
<button onclick="document.getElementById('upload').click()">LOAD_APK_FILE</button>
<button onclick="exportData()">EXPORT_AS_HIGH_RES</button>

<script>
    document.getElementById('upload').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        const zip = await JSZip.loadAsync(file);
        
        // استخراج المعلومات الأساسية
        document.getElementById('size').innerText = (file.size / (1024*1024)).toFixed(2) + " MB";
        
        // تحليل معمارية الـ Lib
        const archs = [];
        zip.folder("lib")?.forEach(p => { 
            const a = p.split('/')[0]; 
            if(a && !archs.includes(a)) archs.push(a); 
        });
        document.getElementById('arch').innerText = archs.join(' | ') || "GENERIC";

        // محاكاة استخراج Package ID (من اسم الملف كبديل سريع لـ Manifest)
        document.getElementById('pkg').innerText = file.name.split('.')[0].toUpperCase();
        document.getElementById('ver').innerText = "v1.0.0-PRO";
    });

    function exportData() {
        html2canvas(document.querySelector("#core-report"), { scale: 5, backgroundColor: "#000" }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'CORE_ANALYSIS.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }
</script>
</body>
</html>
