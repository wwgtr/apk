<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Clean YouTube Player</title>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; padding: 20px; }
        .ios-card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: none; background: #2c2c2e; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border-radius: 12px; border: none; background: #0A84FF; color: white; font-weight: bold; margin-top: 10px; cursor: pointer; }
        #video-container { width: 100%; border-radius: 20px; overflow: hidden; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="ios-card">
    <h2 style="margin: 0 0 10px 0;">مشاهدة بدون إزعاج</h2>
    <input type="text" id="urlInput" placeholder="الصق رابط يوتيوب هنا...">
    <button onclick="loadVideo()">عرض الفيديو</button>
</div>

<div id="video-container" class="ios-card">
    <iframe id="ytPlayer" width="100%" height="315" src="" frameborder="0" allowfullscreen></iframe>
</div>

<script>
    function loadVideo() {
        const url = document.getElementById('urlInput').value;
        const videoId = extractVideoID(url);
        if (videoId) {
            // استخدام رابط embed مع معامل rel=0 لتقليل الاقتراحات المزعجة
            const embedUrl = `https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1`;
            document.getElementById('ytPlayer').src = embedUrl;
            document.getElementById('video-container').style.display = 'block';
        } else {
            alert("رابط غير صحيح");
        }
    }

    function extractVideoID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }
</script>

</body>
</html>
