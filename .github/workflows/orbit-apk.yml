name: Build Orbit APK

on:
  workflow_dispatch:
  push:
    branches: [orbit-client]

permissions:
  contents: read

jobs:
  build:
    name: Build standalone Orbit APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.10.2.4988404"

      - name: Build standalone APK
        env:
          APP_ID: ${{ secrets.ORBIT_API_ID }}
          APP_HASH: ${{ secrets.ORBIT_API_HASH }}
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk
          if-no-files-found: error
          retention-days: 30
